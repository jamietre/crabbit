bind = "127.0.0.1:3000"
db_path = ".dev/crabbit.db"

# Generate with: openssl rand -hex 32
encryption_key_hex = "change-me-generate-with-openssl-rand-hex-32"

# Points at the repo scripts — works when server is run from project root
orchestrator_script = "./orchestrator/run.sh"
agent_env = "./config/dev-agent.env"

[github_oauth]
# Create an OAuth App at https://github.com/settings/developers
# Callback URL: http://localhost:3000/api/v1/auth/github/callback
client_id = ""
client_secret = ""
