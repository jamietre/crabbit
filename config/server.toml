# ~/.config/crabbit/server.toml

# Address and port for the HTTP server.
# Use 0.0.0.0:3000 to listen on all interfaces (needed if accessing from LAN).
bind = "0.0.0.0:3000"

# Path to the SQLite database
db_path = "/home/USERNAME/.local/share/crabbit/crabbit.db"

# 32-byte AES-256-GCM key for encrypting stored credentials (GitHub token).
# Generate with: openssl rand -hex 32
# This value is auto-generated by install.sh — do not lose it.
encryption_key_hex = "CHANGE_ME_GENERATE_WITH_OPENSSL"

# Path to orchestrator/run.sh (spawned when agent runs)
# orchestrator_script = "~/.config/crabbit/orchestrator/run.sh"

# Path to agent.env loaded by the orchestrator
# agent_env = "~/.config/crabbit/agent.env"

# Shared secret for the desktop Claude credential sync daemon.
# Set this to a random string and use the same value when running install-desktop-sync.sh.
# Generate with: openssl rand -hex 16
# claude_sync_secret = "CHANGE_ME"

# Path where Claude credentials are written by the sync daemon.
# Must match CLAUDE_CONFIG_DIR in agent.env with /.credentials.json appended.
# claude_credentials_path = "/home/USERNAME/.local/share/crabbit/claude-config/.credentials.json"

# Verify Claude auth against the Anthropic API on server startup.
# Set to true in production; leave false (default) in dev to avoid unnecessary API calls.
# claude_auth_startup_check = true

[github_oauth]
# Register an OAuth App at https://github.com/settings/developers
# Set Authorization callback URL to: http://<this-server-ip>:3000/api/v1/auth/github/callback
client_id = "YOUR_OAUTH_APP_CLIENT_ID"
client_secret = "YOUR_OAUTH_APP_CLIENT_SECRET"

# Optional: override the callback URL if your server is behind a proxy or has a custom domain.
# callback_url_override = "https://crabbit.example.com/api/v1/auth/github/callback"
