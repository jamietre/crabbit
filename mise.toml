[tools]
rust = "stable"
node = "24"
pnpm = "latest"

[tasks.build]
description = "Build web assets then compile the Rust server"
depends = ["web:build", "server:build"]

[tasks."web:build"]
description = "Build SvelteKit static assets"
dir = "web"
run = "pnpm build"

[tasks."web:install"]
description = "Install dependencies"
dir = "web"
run = "pnpm install"

[tasks."server:build"]
description = "Compile the Rust server (release)"
depends = ["web:build"]
run = "cargo build --release"

[tasks.dev]
description = "Start API server and web dev server concurrently"
run = """
trap 'kill 0' INT TERM EXIT
mise run server:dev &
mise run web:dev &
wait
"""

[tasks."server:dev"]
description = "Run the server in dev mode"
run = "cargo run -p crabbit-server -- --config .config/dev-server.toml"

[tasks."web:dev"]
description = "Start SvelteKit dev server (proxies /api to localhost:3000)"
dir = "web"
run = "pnpm dev"

[tasks."sync:claude-creds"]
description = "Push local Claude OAuth token to the dev server (one-off)"
run = "CRABBIT_API_URL=${CRABBIT_API_URL:-http://127.0.0.1:3000} ./deploy/claude-sync.sh --once"

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf web/build target"
