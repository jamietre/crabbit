[tools]
rust = "stable"
node = "24"

[tasks.build]
description = "Build web assets then compile the Rust server"
depends = ["web:build", "server:build"]

[tasks."web:build"]
description = "Build SvelteKit static assets"
dir = "web"
run = "npm run build"

[tasks."web:install"]
description = "Install npm dependencies"
dir = "web"
run = "npm install"

[tasks."server:build"]
description = "Compile the Rust server (release)"
depends = ["web:build"]
run = "cargo build --release"

[tasks."server:dev"]
description = "Run the server in dev mode"
run = "cargo run -p crabbit-server -- --config ~/.config/crabbit/server.toml"

[tasks."web:dev"]
description = "Start SvelteKit dev server (proxies /api to localhost:3000)"
dir = "web"
run = "npm run dev"

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf web/build target"
