name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web — build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: web
        run: pnpm build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/build/

  rust:
    name: Rust — clippy + test
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web/build/

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Test
        run: cargo test --workspace

  release:
    name: Release — build and publish binary
    runs-on: ubuntu-latest
    needs: [web, rust]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web/build/

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Build release binary
        run: cargo build --release -p crabbit-server

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git tag -f latest
          git push -f origin latest
          gh release create latest \
            --title "Latest build ($(date -u '+%Y-%m-%d %H:%M UTC'))" \
            --notes "Rolling release from \`main\` — commit ${{ github.sha }}" \
            target/release/crabbit-server

  docker:
    name: Docker — build and push images
    runs-on: ubuntu-latest
    needs: [web, rust]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/base/Dockerfile
          push: true
          tags: ghcr.io/jamietre/crabbit-base:latest
          cache-from: type=gha,scope=docker-base
          cache-to: type=gha,mode=max,scope=docker-base

      - name: Build and push node image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/node/Dockerfile
          push: true
          tags: ghcr.io/jamietre/crabbit-node:latest
          cache-from: type=gha,scope=docker-node
          cache-to: type=gha,mode=max,scope=docker-node

      - name: Build and push rust image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/rust/Dockerfile
          push: true
          tags: ghcr.io/jamietre/crabbit-rust:latest
          cache-from: type=gha,scope=docker-rust
          cache-to: type=gha,mode=max,scope=docker-rust

      - name: Build and push python image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/python/Dockerfile
          push: true
          tags: ghcr.io/jamietre/crabbit-python:latest
          cache-from: type=gha,scope=docker-python
          cache-to: type=gha,mode=max,scope=docker-python

      - name: Build and push go image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/go/Dockerfile
          push: true
          tags: ghcr.io/jamietre/crabbit-go:latest
          cache-from: type=gha,scope=docker-go
          cache-to: type=gha,mode=max,scope=docker-go
